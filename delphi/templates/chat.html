<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delphi — Chat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      color: #1a1a1a;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    h1 { font-size: 1.2rem; margin: 0; }
    .model { color: #888; font-size: 0.8rem; }
    a.nav { font-size: 0.85rem; color: #2563eb; text-decoration: none; }
    #log {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      padding: 16px;
      margin-bottom: 12px;
    }
    .msg { margin-bottom: 14px; white-space: pre-wrap; line-height: 1.4; }
    .msg .who { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 2px; }
    .msg.you .who { color: #16a34a; }
    .msg.delphi .who { color: #2563eb; }
    .msg.error { color: #b91c1c; }
    .msg.error .who { color: #b91c1c; }
    form { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:disabled { background: #93a9d8; cursor: default; }
    button.secondary { background: #f5f5f5; color: #333; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>Delphi</h1>
    <div>
      <span class="model">{{ model }}</span>
      · <a class="nav" href="/">Settings</a>
      · <a class="nav" href="#" onclick="resetChat(); return false;">New conversation</a>
    </div>
  </header>

  <div id="log"></div>

  <form id="chat-form">
    <input type="text" id="message" placeholder="Message Delphi..." autocomplete="off" autofocus required>
    <button type="submit" id="send-button">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const sendButton = document.getElementById('send-button');

    function addMessage(who, text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + (cls || who.toLowerCase());
      const whoSpan = document.createElement('span');
      whoSpan.className = 'who';
      whoSpan.textContent = who;
      div.appendChild(whoSpan);
      div.appendChild(document.createTextNode(text));
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function loadHistory() {
      try {
        const res = await fetch('/chat/history');
        const data = await res.json();
        if (data.ok) {
          for (const turn of data.turns) {
            addMessage(turn.role, turn.text);
          }
        }
      } catch (err) {
        // History is a convenience, not critical - a fresh chat still works fine.
      }
    }
    loadHistory();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage('you', message);
      input.value = '';
      input.disabled = true;
      sendButton.disabled = true;
      sendButton.textContent = 'Thinking...';

      try {
        const res = await fetch('/chat/send', {
          method: 'POST',
          body: new URLSearchParams({ message }),
        });
        const data = await res.json();
        if (data.ok) {
          addMessage('delphi', data.reply);
        } else {
          addMessage('delphi', data.error, 'error');
        }
      } catch (err) {
        addMessage('delphi', 'Request failed: ' + err, 'error');
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
        input.focus();
      }
    });

    async function resetChat() {
      if (!confirm('Start a new conversation? This clears Delphi\'s memory of this chat.')) return;
      await fetch('/chat/reset', { method: 'POST' });
      log.innerHTML = '';
    }
  </script>
</body>
</html>
