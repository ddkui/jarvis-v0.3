[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.3.0"
description = "A personal second-brain notes app with a Jarvis-style AI assistant on top."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.100.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
computer-use = [
    "pyautogui>=0.9.54",
    "pillow>=10.0",
]
voice = [
    "chatterbox-tts>=0.1.0",
    "flask>=3.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["templates/*.html"]
